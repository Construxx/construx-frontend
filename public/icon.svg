<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121821" />
      <stop offset="100%" stop-color="#0B0F14" />
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A524" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="#232C3B" stroke-width="12"/>
  
  <!-- Central Emblem -->
  <g transform="translate(96, 96)">
    <!-- Tower crane / building silhouette -->
    <path d="M 60 280 L 60 80 L 160 30 L 260 80 L 260 280 Z" fill="#1A2230" stroke="#334155" stroke-width="6"/>
    <!-- Floor beams -->
    <line x1="60" y1="130" x2="260" y2="130" stroke="#334155" stroke-width="4"/>
    <line x1="60" y1="180" x2="260" y2="180" stroke="#334155" stroke-width="4"/>
    <line x1="60" y1="230" x2="260" y2="230" stroke="#334155" stroke-width="4"/>

    <!-- Glowing Construction C Mark -->
    <path d="M 220 70 C 140 30 70 80 70 160 C 70 240 140 290 220 250" fill="none" stroke="url(#amber)" stroke-width="36" stroke-linecap="round"/>
    
    <!-- Accent Spark -->
    <polygon points="220,50 228,68 248,70 232,84 236,104 220,92 204,104 208,84 192,70 212,68" fill="#F5A524"/>
    
    <!-- Hardhat visor element -->
    <path d="M 120 160 L 200 160 L 190 185 L 130 185 Z" fill="url(#amber)"/>
  </g>
</svg>
